[project]
name = "videos-rodoviarios"
version = "1.0.0"
description = "Aplicativo Windows para análise rodoviária e geração de vídeos MP4 a partir de DXF + KMZ/KML"
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.3.4",
  "shapely>=2.0.6",
  "pyproj>=3.7.0",
  "typer>=0.15.0",
  "Pillow>=10.4.0",
  "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[project.scripts]
video-rodoviario = "videos_rodoviarios.cli:app"
video-rodoviario-gui = "videos_rodoviarios.app_final:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videos_rodoviarios"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["src/videos_rodoviarios/ui_complete.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F841"]
