[project]
name = "videos-rodoviarios"
version = "0.3.1"
description = "Motor de análise e preparação de vídeos técnicos rodoviários a partir de DXF + KMZ/KML"
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.3.4",
  "shapely>=2.0.6",
  "pyproj>=3.7.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[project.scripts]
video-rodoviario = "videos_rodoviarios.cli:app"
video-rodoviario-gui = "videos_rodoviarios.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videos_rodoviarios"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
