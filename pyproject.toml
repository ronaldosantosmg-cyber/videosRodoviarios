[project]
name = "videos-rodoviarios"
version = "0.1.0"
description = "Gerador automatizado de vídeos técnicos rodoviários a partir de DXF + KMZ/KML"
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.3.4",
  "fastkml>=1.1.0",
  "shapely>=2.0.6",
  "pyproj>=3.7.0",
  "pydantic>=2.10.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[project.scripts]
video-rodoviario = "videos_rodoviarios.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videos_rodoviarios"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
