name: Rodovia Studio - verificacao Windows
on:
  push:
    branches: [desenvolvimento/rodovia-studio-1.42]
    paths: ['rodovia_studio/**', '.github/workflows/rodovia-studio-windows.yml']
  pull_request:
    paths: ['rodovia_studio/**', '.github/workflows/rodovia-studio-windows.yml']
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rodovia_studio/pacote/suporte/sistema
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dados isolados do ensaio
        shell: pwsh
        run: |
          "RODOVIA_DATA=$env:RUNNER_TEMP/rodovia_dados" >> $env:GITHUB_ENV
          "PYTHONPYCACHEPREFIX=$env:RUNNER_TEMP/rodovia_pycache" >> $env:GITHUB_ENV
      - name: Dependencias com hashes
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r pip-bootstrap.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements-windows.lock
          python -m pip install pytest httpx
          python -m pip check
      - name: Testes de execucao e protecao no Windows
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          python -m pytest tests/test_v14225_execution.py tests/test_v14225_protection.py tests/test_v14225_install.py -q --junitxml="$env:RUNNER_TEMP/windows-testes.xml"
          if ($LASTEXITCODE -ne 0) {
            [xml]$report = Get-Content "$env:RUNNER_TEMP/windows-testes.xml"
            foreach ($case in $report.SelectNodes('//testcase[failure or error]')) {
              $detail = ($case.InnerText -replace "`r",'' -replace "`n",'%0A')
              Write-Host "::error title=$($case.name)::$detail"
            }
            exit 1
          }
          python -m compileall -q app preparar.py atualizador.py
      - name: Compilar iniciador de fonte para inspecao
        if: always()
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $source = (Resolve-Path '.\iniciador\RodoviaStudio.cs').Path
          $exe = Join-Path $env:RUNNER_TEMP 'RodoviaStudio-auditoria.exe'
          $compilerArgs = @('/nologo','/codepage:65001','/target:winexe','/r:System.Windows.Forms.dll','/r:System.Drawing.dll',('/out:'+$exe),$source)
          $output = & $csc @compilerArgs 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            $message = $output.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Compilacao do iniciador::$message"
            exit 1
          }
      - name: Verificar com Microsoft Defender sem alterar protecoes
        if: always()
        shell: pwsh
        run: |
          $mp = Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mp) { throw 'Defender indisponivel; verificacao pendente' }
          & $mp.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel atualizar assinaturas' }
          Get-MpComputerStatus | Select-Object AMProductVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/defender-versoes.json"
          & $mp.FullName -Scan -ScanType 3 -File (Resolve-Path '../..') -DisableRemediation 2>&1 | Tee-Object "$env:RUNNER_TEMP/defender-pacote.log"
          if ($LASTEXITCODE -ne 0) { throw 'Verificacao do pacote nao aprovada; consultar log' }
          if (Test-Path "$env:RUNNER_TEMP/RodoviaStudio-auditoria.exe") {
            & $mp.FullName -Scan -ScanType 3 -File "$env:RUNNER_TEMP/RodoviaStudio-auditoria.exe" -DisableRemediation 2>&1 | Tee-Object "$env:RUNNER_TEMP/defender-iniciador.log"
            if ($LASTEXITCODE -ne 0) { throw 'Verificacao do iniciador nao aprovada; consultar log' }
          }
          $zip = '../../../../atualizacoes/RodoviaStudio_1_42_25_atualizacao.zip'
          if (Test-Path $zip) {
            & $mp.FullName -Scan -ScanType 3 -File (Resolve-Path $zip) -DisableRemediation 2>&1 | Tee-Object "$env:RUNNER_TEMP/defender-zip.log"
            if ($LASTEXITCODE -ne 0) { throw 'Verificacao do ZIP nao aprovada; consultar log' }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verificacao-windows-seguranca
          path: |
            ${{ runner.temp }}/windows-testes.xml
            ${{ runner.temp }}/defender-*.log
            ${{ runner.temp }}/defender-versoes.json
          if-no-files-found: warn
