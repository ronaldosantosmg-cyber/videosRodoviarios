name: Pacote Windows Rodovia Studio

on:
  push:
    branches: [main]
    tags: ['studio-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pacote:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências Windows com hashes
        run: |
          python -m pip install --require-hashes -r suporte/sistema/requirements-windows.lock
          python -m pip install pytest==9.1.1 httpx==0.28.1
          python -m pip check
      - name: Validar código e inicialização local
        run: |
          python -m compileall -q suporte/sistema scripts tests
          python -m pytest -q tests
          python scripts/verificar_servidor.py
      - name: Gerar pacote Studio (requer Python 3.12 no destino)
        run: python scripts/empacotar_studio.py
      - uses: actions/upload-artifact@v4
        with:
          name: RodoviaStudio-Windows-Python312
          path: dist/*
          if-no-files-found: error
          retention-days: 90
