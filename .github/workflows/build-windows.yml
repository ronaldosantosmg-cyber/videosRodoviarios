name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install -e .[dev]
          pip install pyinstaller

      - name: Testar motor
        shell: pwsh
        run: |
          ruff check .
          pytest -q
          python -m compileall -q src

      - name: Teste rápido do renderizador
        shell: pwsh
        run: |
          python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Gerar executável Windows
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name VideosRodoviarios `
            --collect-all ezdxf `
            --collect-all shapely `
            --collect-all pyproj `
            --collect-all imageio_ffmpeg `
            --collect-all PIL `
            src/videos_rodoviarios/ui_complete.py

      - name: Montar pacote portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacote | Out-Null
          Copy-Item dist/VideosRodoviarios.exe pacote/VideosRodoviarios.exe
          Copy-Item GUIA_RAPIDO.txt pacote/GUIA_RAPIDO.txt
          Copy-Item README.md pacote/README.md
          Compress-Archive -Path pacote/* -DestinationPath VideosRodoviarios-Windows.zip -Force

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: VideosRodoviarios-Windows
          path: VideosRodoviarios-Windows.zip
          if-no-files-found: error
          retention-days: 30
