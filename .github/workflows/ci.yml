name: Validar Rodovia Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: suporte/sistema/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências do Studio
        run: python -m pip install -r suporte/sistema/requirements-dev.txt
      - name: Conferir sintaxe e integração
        run: |
          python -m compileall -q suporte/sistema scripts tests
          python -m pytest -q tests
          python scripts/verificar_servidor.py
      - name: Conferir navegação e bloqueios no Chromium
        run: |
          python -m playwright install --with-deps chromium
          python scripts/verificar_interface.py
          python scripts/verificar_janelas.py
          python scripts/ajuda_validar_interface.py
          python scripts/imagens_validar_pipeline.py
          python scripts/pool_validar_3d.py
      - name: Regressões de tráfego, cancelamento e geometria
        working-directory: suporte/sistema
        run: >-
          python -m pytest -q
          tests/test_v17_speed.py::test_plan_workers_by_cores_and_memory
          tests/test_v14235_critical.py
          tests/test_traffic_hydro.py::test_no_turn_at_grade_separated_crossing
          tests/test_v14239_conflict_guard.py
          tests/test_fila_semaforo.py
          tests/test_desempenho_corredor.py
          tests/test_v31_chegadas_aleatorias.py
          tests/test_v31_fantasmas.py
          tests/test_v31_dxf_preparo.py
          tests/test_v31_surgimento.py
          tests/test_v14278_articulado.py
          tests/test_v370_fleet_policy.py
          tests/test_v370_pedestrian_seed.py
          tests/test_v268_zebrados_dxf.py
          tests/test_v113.py::test_night_factor_transition
          -k 'not api_relatorio and not relatorio_da_simulacao'
      - name: Gerar atualização do código principal
        run: python scripts/empacotar_studio.py
      - uses: actions/upload-artifact@v4
        with:
          name: RodoviaStudio-atualizacao
          path: dist/*
          if-no-files-found: error
