name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar projeto e dependências de teste
        run: python -m pip install -e '.[dev]'

      - name: Validar importação e sintaxe
        run: |
          python -m compileall -q src tests
          python -c "import videos_rodoviarios; print(videos_rodoviarios.__version__)"

      - name: Ruff
        run: python -m ruff check .

      - name: Testes
        run: python -m pytest -q
