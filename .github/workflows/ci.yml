name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python -m pip install -U pip && pip install -e .[dev]
      - name: Ruff
        run: ruff check .
      - name: Testes
        run: pytest -q
